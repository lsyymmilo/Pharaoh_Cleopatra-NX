<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>法老王 Switch 配置工具</title>
<style>
:root{--bg:#1b1b1f;--card:#26262c;--acc:#c9a227;--txt:#e8e2d0;--dim:#9a927d;--line:#3a3a42}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.6 "Microsoft YaHei",system-ui,sans-serif;padding:24px}
h1{font-size:22px;color:var(--acc);margin-bottom:6px}
.sub{color:var(--dim);font-size:13px;margin-bottom:16px}
.wrap{max-width:1080px;margin:0 auto}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input[type=search],select,button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:8px 12px;font-size:14px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:#1b1b1f;font-weight:600;border-color:var(--acc)}
.grp{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.grp>h2{font-size:15px;padding:10px 16px;background:#202025;color:var(--acc);cursor:pointer;user-select:none}
.row{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid #303037}
.row .nm{flex:1;font-size:14px}
.row .key{color:var(--dim);font-size:11px;font-family:Consolas,monospace}
.row.en .nm{color:#c8c8c8;font-size:13px}
.switch{position:relative;width:42px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#4a4a52;border-radius:12px;transition:.15s;cursor:pointer}
.slider:before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#888;top:3px;left:3px;transition:.15s}
.switch input:checked+.slider{background:var(--acc)}
.switch input:checked+.slider:before{transform:translateX(20px);background:#1b1b1f}
.nrow{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid #303037}
.nrow label{flex:1;font-size:14px}
.nrow input[type=number],.nrow input[type=text]{width:110px;background:#1b1b1f;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 10px}
pre{background:#141418;border:1px solid var(--line);border-radius:8px;padding:14px;font:12px/1.5 Consolas,monospace;color:#cfc9b0;max-height:260px;overflow:auto;margin-top:10px}
.hint{background:#20202500;border-left:3px solid var(--acc);padding:8px 12px;color:var(--dim);font-size:13px;margin-bottom:14px}
footer{color:var(--dim);font-size:12px;margin-top:18px;text-align:center}
.filter-hide{display:none!important}
</style>
</head>

<div class="wrap">
<h1>法老王（Pharaoh）Switch 移植版 · 配置工具</h1>
<div class="sub">生成 akhenaten.cfg → 拷贝到 SD 卡 <b>switch/pharaoh/</b> 目录（与 nro 同级）。全部为可选配置；不生成也能游戏。</div>
<div class="hint">流程：按需调整 → 点「生成配置」→ 「下载 akhenaten.cfg」→ 文件放入 SD 卡 <b>/switch/pharaoh/</b>。已有配置可「导入现有配置」继续修改。</div>
<div class="bar">
<input type="search" id="q" placeholder="搜索设置项…">
<select id="quick"><option value="">快捷方案：默认</option><option value="performance">性能优先（关动画/关FPS/关平滑）</option><option value="vanilla">贴近原版（全部玩法开关关闭）</option><option value="enhanced">增强体验（推荐UI开关全开）</option></select>
<button id="reset">恢复默认</button>
<button id="imp">导入现有配置</button>
<button id="gen" class="primary">生成配置</button>
<button id="dl">下载 akhenaten.cfg</button>
<input type="file" id="file" accept=".conf,.txt" style="display:none">
</div>
<div id="groups"></div>
<h2 style="color:var(--acc);margin:10px 0 4px;font-size:16px">生成结果</h2>
<pre id="out">（尚未生成 — 点击「生成配置」）</pre>
<footer>Akhenaten Switch 移植 · 配置工具 · 数据源：game_config.cpp（201 项引擎设置）</footer>
</div>

const G = {fix:'游戏性修复（Bug 修正）', ui:'界面与显示', game:'游戏性改动（玩法重制）', num:'数值与文本设置'};
function grpOf(k){ if(k.startsWith('gameplay_fix'))return 'fix'; if(k.startsWith('gameui'))return 'ui'; if(k.startsWith('gameplay'))return 'game'; return 'ui'; }
const groups = {};
DATA.bool.forEach(it=>{ (groups[grpOf(it.k)] ||= []).push(it); });
function build(){
  const host = document.getElementById('groups'); host.innerHTML='';
  const frag = document.createDocumentFragment();
  for (const g of ['fix','ui','game']){
    const div = document.createElement('div'); div.className='grp'; div.dataset.grp=g;
    const h = document.createElement('h2'); h.textContent=G[g]+'（'+(groups[g]||[]).length+' 项）';
    h.onclick=()=>div.classList.toggle('closed');
    div.appendChild(h);
    const body = document.createElement('div'); body.className='gbody';
    (groups[g]||[]).forEach(it=>{
      const row=document.createElement('div'); row.className='row'+(it.zh?'':' en'); row.dataset.key=it.k.toLowerCase();
      row.innerHTML=`<div class="nm">${it.l.replace(/</g,'&lt;')}<div class="key">${it.k}</div></div>
        <label class="switch"><input type="checkbox" data-k="${it.k}" ${it.d?'checked':''}><span class="slider"></span></label>`;
      body.appendChild(row);
    });
    div.appendChild(body); frag.appendChild(div);
  }
  const nd=document.createElement('div'); nd.className='grp';
  nd.innerHTML=`<h2>${G.num}</h2><div class="gbody" id="nbody"></div>`;
  frag.appendChild(nd); host.appendChild(frag);
  const nb=document.getElementById('nbody');
  for (const [k,v] of Object.entries(DATA.num)){
    const d=DATA.defaults[k];
    const row=document.createElement('div'); row.className='nrow'; row.dataset.key=(v.label+' '+k).toLowerCase();
    row.innerHTML=`<label>${v.label}<div class="key" style="color:var(--dim);font-size:11px;font-family:Consolas,monospace">${k}</div></label>
      <input type="number" data-k="${k}" value="${d}" min="${v.min}" max="${v.max}" step="${v.step}">`;
    nb.appendChild(row);
  }
  for (const [k,v] of Object.entries(DATA.txt)){
    const row=document.createElement('div'); row.className='nrow'; row.dataset.key=(v.label+' '+k).toLowerCase();
    row.innerHTML=`<label>${v.label}<div class="key" style="color:var(--dim);font-size:11px;font-family:Consolas,monospace">${k}</div></label>
      <input type="text" data-k="${k}" value="" placeholder="留空=使用默认" style="width:220px">`;
    nb.appendChild(row);
  }
}
function collect(){
  const obj={};
  document.querySelectorAll('input[type=checkbox][data-k]').forEach(i=>{ if(i.checked!==DATA.defaults[i.dataset.k]) obj[i.dataset.k]=i.checked; });
  document.querySelectorAll('input[type=number][data-k],input[type=text][data-k]').forEach(i=>{
    const v=i.value.trim(); if(v===''||v===undefined) return;
    const num=parseFloat(v); if(!isNaN(num)&&String(num)===v){ if(num!==parseFloat(DATA.defaults[i.dataset.k])) obj[i.dataset.k]=num; }
    else obj[i.dataset.k]=v;
  });
  // 始终显式写 intro 开关（Switch 版无视频）
  if(!('gameui_show_intro_video' in obj)) obj.gameui_show_intro_video=false;
  return obj;
}
function gen(){
  const obj=collect(); let n=0;
  let s='// akhenaten.cfg — 法老王 Switch 移植版配置\n// 由配置工具生成；放在 SD 卡 /switch/pharaoh/ 下\nvar game_settings = {\n';
  const keys=Object.keys(obj).sort();
  keys.forEach((k,i)=>{ const v=obj[k]; s+=`  ${k}: ${typeof v==='string'?JSON.stringify(v):v}`+(i<keys.length-1?',':'')+'\n'; n++; });
  s+='};\n';
  document.getElementById('out').textContent = n? s : '// 全部为默认值 — 无需配置文件（点下载可生成仅含必要项的空配置）\nvar game_settings = {\n  gameui_show_intro_video: false\n};\n';
  return n;
}
document.getElementById('gen').onclick=gen;
document.getElementById('dl').onclick=()=>{
  gen();
  const text=document.getElementById('out').textContent;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));
  a.download='akhenaten.cfg'; a.click();
};
document.getElementById('reset').onclick=()=>{ build(); document.getElementById('out').textContent='（已恢复默认）'; };
document.getElementById('quick').onchange=e=>{
  const m=e.target.value;
  document.querySelectorAll('input[type=checkbox][data-k]').forEach(i=>{ i.checked = DATA.defaults[i.dataset.k]; });
  if(m==='performance'){ set('gameui_show_intro_video',false); set('gameui_draw_fps',true); set('gameui_smooth_scrolling',false); set('gameui_smooth_zoom',false); }
  if(m==='vanilla'){ document.querySelectorAll('input[type=checkbox][data-k]').forEach(i=>{ if(i.dataset.k.startsWith('gameplay')||i.dataset.k.startsWith('gameui_')) i.checked=false; }); }
  if(m==='enhanced'){ ['gameui_sidebar_info','gameui_smooth_scrolling','gameui_show_water_structure_range','gameui_show_building_road_access','gameui_smooth_zoom','gameui_complete_ratings_columns','gameui_highlight_legions','gameui_keep_camera_inertia'].forEach(k=>set(k,true)); set('gameui_show_intro_video',false); }
};
function set(k,v){ const el=document.querySelector(`input[data-k="${k}"]`); if(el) el.checked=v; }
document.getElementById('q').oninput=e=>{
  const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.row,.nrow').forEach(r=>{ r.classList.toggle('filter-hide', q&&!r.dataset.key.includes(q)); });
  document.querySelectorAll('.grp').forEach(g=>{ const vis=[...g.querySelectorAll('.row,.nrow')].some(r=>!r.classList.contains('filter-hide')); g.style.display=vis?'':'none'; });
};
document.getElementById('imp').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    build();
    let txt=rd.result;
    const m=txt.match(/game_settings\s*=\s*{([\s\S]*)}/);
    if(!m){ alert('未在文件中找到 game_settings 对象'); return; }
    let count=0;
    m[1].replace(/\/\/[^\n]*/g,'').split(',').forEach(pair=>{
      const mm=pair.match(/([A-Za-z_][\w]*)\s*:\s*(.+)$/); if(!mm) return;
      const k=mm[1], raw=mm[2].trim();
      const el=document.querySelector(`input[data-k="${k}"]`); if(!el) return;
      if(el.type==='checkbox'){ const v=raw==='true'; el.checked=v; count++; }
      else { el.value=raw.replace(/^"|"$/g,''); count++; }
    });
    alert('已导入 '+count+' 项设置');
  };
  rd.readAsText(f);
};
build();
</script>
